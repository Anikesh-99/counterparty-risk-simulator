[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccr"
version = "0.1.0"
description = "Monte Carlo counterparty credit risk engine: correlated rates & equity paths -> EE, PFE, CVA on collateralized netting sets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anikesh" }]
keywords = ["counterparty-risk", "cva", "monte-carlo", "quant", "xva", "pfe"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
ccr = "ccr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ccr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
